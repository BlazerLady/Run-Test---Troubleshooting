<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Runtest Troubleshooting Tool</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root{
      --bg:#0f172a; --card:#111827; --accent:#60a5fa; --accent-2:#34d399;
      --text:#e5e7eb; --muted:#94a3b8; --danger:#f87171; --border:#1f2937; --focus:#fbbf24;
    }
    html, body { margin:0; padding:0; background:var(--bg); color:var(--text); font-family: system-ui, -apple-system, Segoe UI, Roboto, Inter, "Helvetica Neue", Arial, "Noto Sans"; }
    .wrap { max-width: 1000px; margin: 32px auto; padding: 0 16px; }
    header { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:16px; }
    .title { font-size: clamp(1.25rem, 2.5vw, 1.75rem); font-weight:700; letter-spacing:.2px; }
    .controls { display:flex; gap:8px; flex-wrap:wrap; }
    button, .pill { background: transparent; color: var(--text); border: 1px solid var(--border); padding: 8px 12px; border-radius:10px; cursor:pointer; }
    button:hover, .pill:hover { border-color: var(--accent); }
    button:focus { outline: 3px solid var(--focus); outline-offset: 2px; }
    .card { background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.00)); border:1px solid var(--border); border-radius:16px; padding:20px; box-shadow: 0 8px 18px rgba(0,0,0,0.25); }
    .question { font-size:1.125rem; font-weight:600; margin: 4px 0 8px; }
    .content { color: var(--muted); margin-bottom: 16px; line-height: 1.5; }
    .options { display:flex; flex-direction: column; gap: 10px; }
    .option { display:flex; align-items:center; justify-content:space-between; gap:10px; background: #0b1220; border:1px solid var(--border); border-radius:12px; padding: 12px; }
    .option .label { font-weight:600; }
    .option .go { color: var(--accent); font-size:.95rem; }
    .option:hover { border-color: var(--accent); }
    .chips { display:flex; gap:8px; flex-wrap:wrap; margin:8px 0 0; }
    .chip { background:#0b1220; border:1px solid var(--border); color: var(--muted); font-size:.85rem; padding:4px 8px; border-radius:999px; }
    .breadcrumb { margin: 10px 0 16px; color: var(--muted); font-size: .9rem; display:flex; flex-wrap:wrap; gap:6px; }
    .crumb { background:#0b1220; border:1px solid var(--border); border-radius:999px; padding:3px 8px; }
    .crumb.current { border-color: var(--accent); color: var(--text); }
    .footer-note { color: var(--muted); font-size:.85rem; margin-top:12px; }
   
 
    .hidden { display:none !important; }
    .searchBar { display:flex; gap:8px; margin: 8px 0 12px; }
    .searchBar input { flex:1; background:#0b1220; color:var(--text); border:1px solid var(--border); border-radius:10px; padding:10px 12px; }
    .hits { margin-top: 6px; color: var(--muted); font-size:.9rem; }
    .results { margin-top: 8px; display: grid; gap:8px; }
    .result { background:#0b1220; border:1px solid var(--border); border-radius:10px; padding:8px 10px; cursor:pointer; }
    .result:hover { border-color: var(--accent); }
    @media (min-width: 700px) { .options { flex-direction: row; flex-wrap: wrap; } .option { width: calc(50% - 5px); } }
  </style>
</head>

  <div class="wrap" role="application" aria-label="Interactive troubleshooting guide">
    <header>
      <div class="title" id="appTitle">Runtest Troubleshooting Tool</div>
      <div class="controls" role="toolbar" aria-label="Navigation">
        <button id="backBtn" aria-label="Go back (Alt+←)">&larr; Back</button>
        <button id="homeBtn" aria-label="Restart guide (Alt+H)">&#8962; Home</button>
      </div>
    </header>

    <section class="card" aria-live="polite">
      <div class="breadcrumb" id="breadcrumb" aria-label="Progress"></div>

      <div class="searchBar" aria-label="Search steps">
        <input type="search" id="searchInput" placeholder="Search steps or outcomes… (e.g., lockout, capacitor, fuse)" aria-label="Search steps" />
        <button id="searchClear" aria-label="Clear search">Clear</button>
      </div>
      <div class="hits" id="hits"></div>
      <div class="results hidden" id="results"></div>

      <h2 class="question" id="question"></h2>
      <div class="content" id="content"></div>

      <div class="options" id="options" role="list"></div>
      <div class="chips" id="chips"></div>
      <div class="footer-note" id="footer"></div>
    </section>
  </div>

    const historyStack = [];
    let currentNodeId = null;

    function $(id){ return document.getElementById(id); }
    function getNodeById(id){ return decisionTreeData.nodes.find(n => n.id === id); }
    function isEndNode(node){ return !node.options || node.options.length === 0; }
   function sanitize(html){
  // Escape everything first
  const div = document.createElement('div');
  div.textContent = html || "";
  let safe = div.innerHTML;

  // Allow a small, explicit whitelist of tags we trust in our own content
  // (block-level) table, thead, tbody, tr, th, td, caption, br
  // (inline) strong, em, code, a
  const allow = /<(\/?)(table|thead|tbody|tr|th|td|caption|br|strong|em|code|a)(\s[^>]*)?>/gi;

  // Re-insert allowed tags by replacing their escaped versions
  // Note: the browser will still parse attributes; do not insert untrusted user input.
  safe = safe
    .replace(/&lt;(\/?)(table|thead|tbody|tr|th|td|caption|br|strong|em|code|a)(\s[^&]*)&gt;/gi, '<$1$2$3>')
    .replace(/&lt;(\/?)(table|thead|tbody|tr|th|td|caption|br|strong|em|code|a)&gt;/gi, '<$1$2>');

  return safe;
}


    function renderBreadcrumb() {
      const el = $("breadcrumb");
      el.innerHTML = "";
      const trail = historyStack.concat(currentNodeId ? [currentNodeId] : []);
      trail.forEach((id, idx) => {
        const node = getNodeById(id);
        const span = document.createElement('span');
        span.className = "crumb" + (idx === trail.length - 1 ? " current" : "");
        span.textContent = node ? node.title : id;
        span.title = "Go to: " + (node ? node.title : id);
        span.tabIndex = 0;
        span.addEventListener('click', () => jumpToIndex(idx));
        span.addEventListener('keypress', (e)=>{ if(e.key === 'Enter' || e.key === ' ') jumpToIndex(idx); });
        el.appendChild(span);
      });
    }

    function jumpToIndex(idx){
      const trail = historyStack.concat([currentNodeId]);
      const targetId = trail[idx];
      historyStack.length = 0;
      for (let i = 0; i < idx; i++) historyStack.push(trail[i]);
      currentNodeId = targetId;
      render();
    }

    function renderNode(node){
      $("nodeTypeText").textContent = isEndNode(node) ? "Outcome" : " ";
      $("question").textContent = node.title;
      $("content").innerHTML = sanitize(node.content || "");
      $("chips").innerHTML = "";
      (node.tags || []).forEach(tag => {
        const chip = document.createElement('span');
        chip.className = "chip";
        chip.textContent = tag;
        $("chips").appendChild(chip);
      });

      const opts = $("options");
      opts.innerHTML = "";
      if (node.options && node.options.length) {
        node.options.forEach(opt => {
          const li = document.createElement('div');
          li.className = "option";
          li.setAttribute("role", "listitem");
          const label = document.createElement('div');
          label.className = "label";
          label.textContent = opt.label;
          const go = document.createElement('button');
          go.className = "go";
          go.setAttribute("aria-label", `Choose: ${opt.label}`);
          go.textContent = "Go →";
          go.addEventListener('click', ()=> navigate(opt.nextId));
          li.appendChild(label);
          li.appendChild(go);
          opts.appendChild(li);
        });
      } else {
        const done = document.createElement('div');
        done.className = "option";
        done.innerHTML = `<div class="label">You’ve reached an outcome.</div><div class="go">Restart or go back</div>`;
        opts.appendChild(done);
      }
    }

    function navigate(nextId){
      if (!nextId) return;
      if (currentNodeId) historyStack.push(currentNodeId);
      currentNodeId = nextId;
      render();
    }

    function goBack(){
      if (historyStack.length === 0) return;
      currentNodeId = historyStack.pop();
      render();
    }

    function goHome(){
      historyStack.length = 0;
      currentNodeId = decisionTreeData.meta.start;
      render();
    }

    function render(){
      const node = getNodeById(currentNodeId) || getNodeById(decisionTreeData.meta.start);
      currentNodeId = node.id;
      $("appTitle").textContent = decisionTreeData.meta.title || "Troubleshooting Guide";
      $("footer").textContent = decisionTreeData.meta.footer || "";
      renderNode(node);
      renderBreadcrumb();
      updateNavButtons();
      $("results").classList.add("hidden");
      $("hits").textContent = "";
    }

    function updateNavButtons(){
      $("backBtn").disabled = historyStack.length === 0;
    }

    function searchNodes(query){
      const q = query.trim().toLowerCase();
      if (!q) return [];
      return decisionTreeData.nodes
        .map(n => ({ node: n, hay: (n.title + " " + (n.content || "") + " " + (n.tags || []).join(" ")).toLowerCase() }))
        .filter(x => x.hay.includes(q))
        .map(x => x.node);
    }

    function showSearchResults(list, query){
      const results = $("results");
      results.innerHTML = "";
      if (list.length === 0){
        $("hits").textContent = query ? `No matches for “${query}”` : "";
        results.classList.add("hidden");
        return;
      }
      $("hits").textContent = `${list.length} match${list.length>1?"es":""} for “${query}”`;
      list.forEach(n => {
        const r = document.createElement("div");
        r.className = "result";
        r.innerHTML = `<strong>${n.title}</strong><div class="content">${sanitize(n.content).slice(0,180)}${(n.content||"").length>180?"…":""}</div>`;
        r.addEventListener('click', ()=> { historyStack.push(currentNodeId); currentNodeId = n.id; render(); });
        results.appendChild(r);
      });
      results.classList.remove("hidden");
    }

    document.addEventListener('keydown', (e) => {
      if (e.altKey && e.key.toLowerCase() === 'h') { goHome(); }
      if ((e.altKey && e.key === 'ArrowLeft') || e.key === 'Escape') { goBack(); }
    });

    $("backBtn").addEventListener('click', goBack);
    $("homeBtn").addEventListener('click', goHome);
    $("searchClear").addEventListener('click', ()=>{ $("searchInput").value=""; $("results").classList.add("hidden"); $("hits").textContent=""; $("searchInput").focus(); });
    $("searchInput").addEventListener('input', (e)=>{ const q = e.target.value; const list = searchNodes(q); showSearchResults(list, q); });

    currentNodeId = (decisionTreeData.meta && decisionTreeData.meta.start) || "start";
    render();
  </script>
